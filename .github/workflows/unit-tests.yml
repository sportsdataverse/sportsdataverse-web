name: unit-tests

# The frontend's lint (`npm run lint`) and unit tests (`npm run test:lib`),
# including the reader scan that keeps unapproved package submissions off
# every public page.
#
# Its own workflow with NO paths filter, so it reports on every pull request: a
# required check whose workflow is skipped by a paths filter stays "expected"
# forever and blocks the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lib:
    # needs no database or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:lib
        if: ${{ !cancelled() }}
        working-directory: frontend

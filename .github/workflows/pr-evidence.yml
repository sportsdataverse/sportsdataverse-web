name: pr-evidence

# Posts the review evidence CLAUDE.md "PR evidence" requires on every PR that touches
# frontend/: the desktop/mobile x light/dark screenshots of the PR, a Lighthouse
# comparison against its base, and a walkthrough video per evidence route (plus any
# `Walkthrough steps: scripts/walkthroughs/<flow>.mjs` the PR names), as ONE comment
# that each push updates.
#
# Nothing is built here. Vercel already deploys every commit with the project's real
# environment, and reports each deployment to GitHub's deployments API:
#   head = the Vercel Preview deployment of the PR head commit (waited for, ~2-5 min)
#   base = the Vercel Production deployment of the PR's merge-base with its base branch,
#          falling back to the live site when Vercel no longer lists one
#
# Pages come from an `Evidence routes: /a /b` line in the PR description (read at run
# time, so "Re-run jobs" picks up an edit); DEFAULT_ROUTES otherwise.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only by default. The evidence job widens it, and even there the token is handed only to
# steps that run no PR-controlled code (checkouts never persist it; the PR's scripts run tokenless).
permissions:
  contents: read

jobs:
  scripts:
    # the verdict rules are the part of the evidence that can be wrong silently
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/lighthouse-verdicts.test.mjs
        working-directory: frontend

  evidence:
    # A fork PR gets a read-only token (it could not post) and no Vercel preview without
    # authorization. Drafts wait until ready for review.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push screenshots + clips to the pr-previews branch (publish step only)
      pull-requests: write   # post / update the evidence comment (comment step only)
      deployments: read      # find the Vercel deployments
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_ROUTES: / /packages
      LIVE_SITE: https://sportsdataverse.org
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evidence directory (outside the checkout)
        run: echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install review tools (deliberately not repo dependencies)
        # recordVideo (walkthrough.mjs) needs Playwright's own ffmpeg build; the mp4 conversion
        # needs a real one, which ubuntu-latest no longer ships
        run: |
          npm i -g --no-audit --no-fund lighthouse@12 playwright-core@1
          playwright-core install ffmpeg
          sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null

      - name: Resolve routes
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')"
          line="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*Evidence routes:[[:space:]]*//Ip' | head -1 | tr -d '`\r')"
          # keep only path-shaped tokens (at most 4), so nothing else reaches a command line
          routes="$(printf '%s\n' "${line:-$DEFAULT_ROUTES}" | tr ' ,' '\n\n' | grep -E '^/[A-Za-z0-9/_.-]*$' | head -4 | tr '\n' ' ' || true)"
          echo "routes=${routes:-$DEFAULT_ROUTES}" >> "$GITHUB_OUTPUT"
          echo "routes: ${routes:-$DEFAULT_ROUTES}"
          # optional scripted flows: only committed files under scripts/walkthroughs/ (at most 4)
          sline="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*Walkthrough steps:[[:space:]]*//Ip' | head -1 | tr -d '`\r')"
          steps=""
          for f in $(printf '%s\n' "$sline" | tr ' ,' '\n\n' | grep -E '^scripts/walkthroughs/[A-Za-z0-9_-]+\.mjs$' | head -4); do
            [ -f "frontend/$f" ] && steps="$steps $f"
          done
          echo "steps=${steps# }" >> "$GITHUB_OUTPUT"
          echo "steps: ${steps:-(none)}"

      - name: Find the Vercel deployments
        id: deploys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest successful deployment URL for a commit in an environment, or empty
          deployment_url() {
            for id in $(gh api "repos/$REPO/deployments?sha=$1&environment=$2&per_page=10" --jq '.[].id'); do
              state="$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // ""')"
              url="$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].environment_url // ""')"
              if [ "$state" = success ] && [ -n "$url" ]; then echo "$url"; return; fi
              if [ "$state" = failure ] || [ "$state" = error ]; then echo "FAILED"; return; fi
            done
          }

          head_url=""
          for i in $(seq 1 50); do   # up to ~25 min for Vercel to build the preview
            head_url="$(deployment_url "$PR_HEAD_SHA" Preview)"
            [ -n "$head_url" ] && break
            sleep 30
          done
          if [ -z "$head_url" ] || [ "$head_url" = FAILED ]; then
            echo "::error::No successful Vercel Preview deployment for $PR_HEAD_SHA (${head_url:-timed out})"
            exit 1
          fi

          git fetch -q origin "$BASE_REF"
          merge_base="$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA")"
          base_url="$(deployment_url "$merge_base" Production)"
          if [ -n "$base_url" ] && [ "$base_url" != FAILED ]; then
            base_label="Production deployment of ${merge_base:0:7}"
          else
            base_url="$LIVE_SITE"
            base_label="live site (Vercel lists no Production deployment for ${merge_base:0:7})"
          fi
          {
            echo "head_url=$head_url"
            echo "base_url=$base_url"
            echo "base_label=$base_label"
          } >> "$GITHUB_OUTPUT"
          echo "head: $head_url"; echo "base: $base_url ($base_label)"

      - name: Screenshots + Lighthouse comparison
        id: compare
        working-directory: frontend
        env:
          ROUTES: ${{ steps.routes.outputs.routes }}
          HEAD_URL: ${{ steps.deploys.outputs.head_url }}
          BASE_URL: ${{ steps.deploys.outputs.base_url }}
          BASE_LABEL: ${{ steps.deploys.outputs.base_label }}
          CHROME_PATH: /usr/bin/google-chrome
          VISUAL_CHECK_EXECUTABLE: /usr/bin/google-chrome
          # Ubuntu 24.04 runners block the unprivileged user namespaces Chrome's sandbox needs
          LIGHTHOUSE_NO_SANDBOX: '1'
          VISUAL_CHECK_NO_SANDBOX: '1'
        run: |
          export NODE_PATH="$(npm root -g)"
          set +e
          # ROUTES is validated above; word splitting into separate args is intended
          node scripts/lighthouse-compare.mjs --base-url "$BASE_URL" --head-url "$HEAD_URL" \
            --base-label "$BASE_LABEL" --head-label "Preview of ${PR_HEAD_SHA:0:7}" \
            --runs 3 --shots --out "$EVIDENCE_DIR" $ROUTES
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Walkthrough videos
        id: walkthrough
        if: always() && steps.deploys.outcome == 'success'
        working-directory: frontend
        env:
          ROUTES: ${{ steps.routes.outputs.routes }}
          STEPS: ${{ steps.routes.outputs.steps }}
          BASE: ${{ steps.deploys.outputs.head_url }}
          OUT: ${{ env.EVIDENCE_DIR }}/walkthrough
          VISUAL_CHECK_EXECUTABLE: /usr/bin/google-chrome
          VISUAL_CHECK_NO_SANDBOX: '1'
        run: |
          export NODE_PATH="$(npm root -g)"
          set +e
          rc=0
          # ROUTES / STEPS are validated above; word splitting into separate args is intended
          node scripts/walkthrough.mjs $ROUTES || rc=$?
          for f in $STEPS; do node scripts/walkthrough.mjs --steps "$f" || rc=$?; done
          echo "exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Keep raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish screenshots + walkthrough clips to pr-previews
        id: publish
        if: always() && (steps.compare.outcome == 'success' || steps.walkthrough.outcome == 'success')
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          shots="$EVIDENCE_DIR/shots"
          clips="$EVIDENCE_DIR/walkthrough"
          if ! ls "$shots"/*.jpg "$clips"/*.mp4 "$clips"/*.webm >/dev/null 2>&1; then echo "nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/pr-previews"
          dest="pr$PR/${PR_HEAD_SHA:0:7}"
          if git fetch -q origin pr-previews; then
            git worktree add --detach "$wt" FETCH_HEAD
          else
            git worktree add --detach "$wt" HEAD
            git -C "$wt" checkout --orphan pr-previews
            git -C "$wt" rm -rfq .
          fi
          mkdir -p "$wt/$dest"
          cp "$shots"/*.jpg "$wt/$dest/" 2>/dev/null || true
          # mp4 when the conversion ran, else the webm (browsers play both from a raw link)
          for w in "$clips"/*.webm; do [ -f "$w" ] || continue; [ -f "${w%.webm}.mp4" ] && cp "${w%.webm}.mp4" "$wt/$dest/" || cp "$w" "$wt/$dest/"; done
          git -C "$wt" add "$dest"
          # a re-run of the same commit can reproduce identical images: nothing to commit, still publish
          if ! git -C "$wt" diff --cached --quiet; then
            git -C "$wt" commit -qm "chore(previews): PR #$PR @ ${PR_HEAD_SHA:0:7}"
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
            # other PRs push here concurrently; their paths never overlap, so rebase and retry
            for attempt in 1 2 3 4 5; do
              git -C "$wt" -c "http.https://github.com/.extraheader=$auth" push -q origin HEAD:refs/heads/pr-previews && break
              git -C "$wt" fetch -q origin pr-previews
              git -C "$wt" rebase -q FETCH_HEAD
              [ "$attempt" = 5 ] && exit 1
            done
          fi
          echo "image_base=https://raw.githubusercontent.com/$REPO/$(git -C "$wt" rev-parse HEAD)/$dest" >> "$GITHUB_OUTPUT"

      - name: Render the evidence comment
        # runs the PR's comment script, so it gets no token
        if: always() && !cancelled()
        env:
          IMAGE_BASE: ${{ steps.publish.outputs.image_base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          if [ -f frontend/scripts/pr-evidence-comment.mjs ] && [ -f "$EVIDENCE_DIR/summary.json" ]; then
            node frontend/scripts/pr-evidence-comment.mjs --out "$EVIDENCE_DIR" --image-base "$IMAGE_BASE" \
              --run-url "$RUN_URL" --pr-head "$PR_HEAD_SHA" --default-routes "$DEFAULT_ROUTES" > "$body"
          else
            printf '<!-- pr-evidence -->\n## PR evidence: `%s`\n\nThe evidence run failed before producing results (often: the Vercel preview did not build). See the [run log](%s).\n' \
              "${PR_HEAD_SHA:0:7}" "$RUN_URL" > "$body"
          fi

      - name: Post or update the evidence comment
        # workflow-defined shell only: reads the rendered file, never executes repo code
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-evidence -->"))) | .id' | tail -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" --jq .html_url
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" --jq .html_url
          fi

      - name: Fail when the comparison or a walkthrough did not complete
        if: steps.compare.outputs.exit != '0' || steps.walkthrough.outputs.exit != '0'
        run: |
          echo "lighthouse-compare exited '${{ steps.compare.outputs.exit }}', walkthrough exited '${{ steps.walkthrough.outputs.exit }}'; the posted comment lists what failed."
          exit 1

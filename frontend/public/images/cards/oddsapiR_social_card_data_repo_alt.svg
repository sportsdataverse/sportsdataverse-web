<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    odds-data social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold-topped footer bar carrying the URL.
    Generated by make_cards.py; edit the config there and re-render rather
    than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33090C"/>
      <stop offset="100%" stop-color="#140304"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="39%" r="62%">
      <stop offset="0%" stop-color="#140304" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#140304" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <!-- motif sits back so the type leads; it fought the tagline at 0.45 -->
  <g opacity="0.32">
    <g fill="#7A2A30">
    <rect x="90" y="185" width="72" height="395" rx="8"/>
    <rect x="202" y="300" width="72" height="280" rx="8"/>
    <rect x="314" y="240" width="72" height="340" rx="8"/>
    <rect x="426" y="387" width="72" height="193" rx="8"/>
    <rect x="538" y="327" width="72" height="253" rx="8"/>
    <rect x="650" y="438" width="72" height="142" rx="8"/>
    <rect x="762" y="268" width="72" height="312" rx="8"/>
    <rect x="874" y="360" width="72" height="220" rx="8"/>
    <rect x="986" y="217" width="72" height="363" rx="8"/>
    <rect x="1098" y="415" width="72" height="165" rx="8"/>
    </g>
    <path d="M70,580 H1210" stroke="#7A2A30" stroke-width="6" fill="none"/>
    <polyline points="126,185 238,300 350,240 462,387 574,327 686,438 798,268 910,360 1022,217 1134,415" fill="none" stroke="#6FD08C" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#6FD08C">
    <circle cx="126" cy="185" r="13"/>
    <circle cx="238" cy="300" r="13"/>
    <circle cx="350" cy="240" r="13"/>
    <circle cx="462" cy="387" r="13"/>
    <circle cx="574" cy="327" r="13"/>
    <circle cx="686" cy="438" r="13"/>
    <circle cx="798" cy="268" r="13"/>
    <circle cx="910" cy="360" r="13"/>
    <circle cx="1022" cy="217" r="13"/>
    <circle cx="1134" cy="415" r="13"/>
    </g>
  </g>
  <!-- soft pool behind the type so the motif never runs through a letterform -->
  <rect width="1280" height="554" fill="url(#focus)"/>

  <text x="640" y="290" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="146" font-weight="700"
        stroke="#140304" stroke-width="14" paint-order="stroke"><tspan fill="#FFFFFF">odds</tspan><tspan fill="#6FD08C">-data</tspan></text>

  <text x="640" y="359" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="34" font-weight="600" fill="#6FD08C"
        letter-spacing="3">THE HISTORICAL ODDS RELEASES</text>

  <rect x="0" y="554" width="1280" height="86" fill="#140304"/>
  <rect x="0" y="554" width="1280" height="4" fill="#FFB612"/>
  <text x="640" y="612" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="32" font-weight="600" fill="#EEF2F6"
        letter-spacing="2">oddsapiR.sportsdataverse.org</text>
</svg>

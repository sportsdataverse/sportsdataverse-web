# Manual only. This fetcher has never committed anything: its luigi targets
# land under python/tmp/, which the repo does not track, and the step stages
# with `-u` (tracked files only). It ran daily against the `with-data` branch,
# which is no longer synced with main -- see the retirement note in CLAUDE.md.
# Re-enable the schedule once the fetcher writes to tracked paths.
on:
  workflow_dispatch:

name: Update data

jobs:
  build:
    name: Update data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
            python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update data
        run: cd python && TOKEN=${{ secrets.GITHUB_TOKEN }} python data_fetcher.py
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@v7.2.0 # v6
        with:
          commit_message: Update ${{ steps.date.outputs.date }}
          commit_author: Auto fetch <actions@github.com> # defaults to author of the commit that triggered the run
          add_options: '-u'
